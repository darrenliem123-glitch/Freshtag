<style>
:root{--g:#2f7d4f;--gd:#1f5c38;--gl:#e3f1e7;--c:#faf6ea;--ink:#23312a;--m:#6b7a70;--r:#c8453b;--o:#e08a1e;--w:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--c);color:var(--ink)}
header{background:var(--g);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:22px}header span{opacity:.85;font-size:13px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;color:#fff;border:1px solid #ffffff66;border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px}
nav button.on{background:#fff;color:var(--gd);font-weight:600}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--w);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
h2{margin:0 0 10px;font-size:18px;color:var(--gd)}h3{margin:12px 0 6px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--w);border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 4px #0001}
.stat b{font-size:30px;display:block}.stat small{color:var(--m)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.item:last-child{border:0}.item .n{flex:1}.item .n small{color:var(--m);display:block}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--gl);color:var(--gd)}.soon{background:#fdebd0;color:#a05a00}.bad{background:#f9d9d6;color:var(--r)}
button.b,.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px}
button.b.s{background:var(--gl);color:var(--gd)}button.b.d{background:#f9d9d6;color:var(--r)}button.sm{padding:5px 10px;font-size:12px}
input,select{padding:9px;border:1px solid #cfd8d2;border-radius:9px;font-size:14px;width:100%;background:#fff}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{font-size:12px;color:var(--m);display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.grid button{background:var(--gl);border:0;border-radius:10px;padding:10px 4px;cursor:pointer;font-size:13px}
.grid button:hover{background:#cfe6d6}.grid span{display:block;font-size:22px}
video{width:100%;max-height:260px;border-radius:10px;background:#000;display:none;margin-top:8px}
.note{font-size:12px;color:var(--m);margin-top:6px}.mock{background:#fff3cd;color:#7a5b00;padding:2px 8px;border-radius:8px;font-size:11px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input,.bar select{flex:1;min-width:140px;width:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}.empty{text-align:center;color:var(--m);padding:20px}.md{position:fixed;top:0;left:0;right:0;bottom:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.mc{background:#fff;border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:85vh;overflow:auto}.ob{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(160deg,var(--gd),var(--g) 60%,#7fbf8f);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.ob .pg{background:var(--c);border-radius:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:20px;text-align:center;animation:up .35s}.ob .big{font-size:64px;animation:bob 2s ease-in-out infinite}.ob ul{text-align:left;padding-left:18px;line-height:1.7}.pbar{height:6px;background:#dfe8e0;border-radius:4px;margin-bottom:14px}.pbar i{display:block;height:100%;background:var(--g);border-radius:4px;transition:.3s}.ch{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;text-align:left;cursor:pointer;border:0;width:100%;font-size:14px}.ch span{font-size:28px;background:var(--gl);border-radius:10px;width:46px;height:46px;display:flex;align-items:center;justify-content:center}@keyframes up{from{transform:translateY(24px);opacity:0}}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}.cf{position:fixed;top:-30px;font-size:24px;animation:fall 3s linear forwards;pointer-events:none;z-index:31}
.rec{border:1px solid #e2eadf;border-radius:12px;padding:12px;margin-bottom:10px}

return `<div class='card'><h2>🍳 Ide masak</h2><div class='note' style='margin:0 0 10px'>Diurutkan dari yang mudah ke sulit. Bahan yang hampir kedaluwarsa ditandai ⏰. Ketuk resep untuk melihat langkahnya.</div>${L.length?L.map(r=>`<div class='rec' style='cursor:pointer' onclick='showRec(${r.idx})'><b>${r.n}</b> <span class='badge ${LC[r.lv]}'>${LV[r.lv]}</span> <small>(${r.hit.length}/${r.ing.length} bahan ada)</small><div>${r.ing.map(g=>`<span class='tag ${r.urg.includes(g)?'u':''}' style='${r.hit.includes(g)?'':'opacity:.4'}'>${g}${r.urg.includes(g)?' ⏰':''}</span>`).join('')}</div></div>`).join(''):`<div class='empty'>Tambahkan bahan dulu untuk dapat saran resep.</div>`}</div>`}
function showRec(i){const[n,ing,lv,st,q]=RECIPES[i];modal(`<h2>${n}</h2><span class='badge ${LC[lv]}'>${LV[lv]}</span><h3>Bahan</h3><div>${ing.map(g=>`<span class='tag'>${g}</span>`).join('')}</div><h3>Langkah singkat</h3><ol>${st.split('|').map(s=>`<li>${s}</li>`).join('')}</ol><a class='btn' style='display:inline-block;text-decoration:none' target='_blank' rel='noopener' href='https://www.youtube.com/results?search_query=${encodeURIComponent(q)}'>▶ Cari video di YouTube</a>`)}
function riw(){pruneLog();const L=[...logs].reverse();return `<div class='card'><h2>🕘 Riwayat 7 hari terakhir</h2><div class='note' style='margin:0 0 10px'>Barang yang ditandai habis atau dihapus tersimpan 7 hari, lalu terhapus permanen. Tekan Urungkan untuk mengembalikan ke stok.</div>${L.length?L.map(l=>`<div class='item'><div class='n'><b>${esc(l.item.name)}</b><small>${l.type=='habis'?'✅ Habis':'🗑️ Dihapus'} · ${new Date(l.at).toLocaleDateString('id-ID')} · tersisa ${Math.max(1,Math.ceil((6048e5-(Date.now()-l.at))/864e5))} hari sebelum hilang permanen</small></div><button class='b s sm' onclick='restore(${l.lid})'>Urungkan</button></div>`).join(''):`<div class='empty'>Belum ada riwayat.</div>`}</div>`}
function restore(lid){const l=logs.find(x=>x.lid==lid);if(!l)return;items.push(l.item);stats[l.key]=Math.max(0,stats[l.key]-1);logs=logs.filter(x=>x!==l);save();saveSt();saveLog();render();toast('Dikembalikan ke stok ✓')}
function subscribe(i){const p=PLANS[i];sub={name:p[0],until:Date.now()+p[1]*864e5};LS.ft_sub=JSON.stringify(sub);render();toast('Langganan '+p[0]+' aktif (simulasi) ✓')}
function unsub(){sub=null;LS.removeItem('ft_sub');render()}
function editItem(id){const x=items.find(i=>i.id==id);if(!x)return;modal(`<h2>Ubah bahan</h2><div class='row' style='grid-template-columns:1fr'><div><label>Nama</label><input id='e_n' value='${esc(x.name)}'></div><div><label>Kategori</label><select id='e_c' onchange="catTog('e_c','e_cx')">${Object.keys(SHELF).map(c=>`<option ${(c==x.cat||(c=='Lainnya'&&!SHELF[x.cat]))?'selected':''}>${c}</option>`).join('')}</select><input id='e_cx' placeholder="${L('Tulis kategori sendiri','Type your own category')}" value='${SHELF[x.cat]?'':esc(x.cat)}' style='display:${SHELF[x.cat]?'none':'block'};margin-top:6px' autocomplete='off'></div><div><label>Jumlah</label><input id='e_q' type='text' value='${esc(x.qty)}' autocomplete='off'></div><div><label>Tanggal beli</label><input id='e_b' type='date' value='${x.added}'></div><div><label>Kedaluwarsa</label><input id='e_e' type='date' value='${x.exp}'></div></div><button class='b' style='margin-top:12px' onclick='saveEdit(${x.id})'>Simpan</button>`)}
function saveEdit(id){const x=items.find(i=>i.id==id),n=$('#e_n').value.trim();if(!x)return;if(!n||!$('#e_e').value)return toast('Nama dan tanggal wajib diisi');const ch=$('#e_e').value!=x.exp;Object.assign(x,{name:n,cat:catVal('e_c','e_cx'),qty:($('#e_q').value.trim()||'1'),added:$('#e_b').value||x.added,exp:$('#e_e').value});if(ch)x.est=false;save();closeM();render();toast('Perubahan disimpan ✓')}
function pfBtn(){const b=$('#pf');if(b)b.textContent=user?'👤 '+user.name.split(' ')[0]:'👤 Masuk'}
let mem=J('ft_mem','[]').filter(m=>m&&typeof m.email==='string');
function membersHtml(act){return `<h3>👥 Akun bersama</h3><div class='note' style='margin:0 0 8px'>Seperti paket keluarga: undang sampai 5 anggota untuk memantau dan mengedit stok yang sama. Pemantau hanya melihat, Editor boleh mengubah. Setiap anggota memakai akunnya sendiri di perangkatnya sendiri.</div>${act?`<div class='item'><div class='n'><b>${esc(user?user.name:'Kamu')}</b><small>Pemilik</small></div></div>${mem.map((m,i)=>`<div class='item'><div class='n'><b>${esc(m.email)}</b><small>${m.role}</small></div><button class='b d sm' onclick='delMem(${i})'>Hapus</button></div>`).join('')}<div class='bar' style='margin-top:8px'><input id='me' placeholder='email anggota'><select id='mr'><option>Editor</option><option>Pemantau</option></select><button class='b' onclick='addMem()'>Undang</button></div><div class='note'>Prototype: undangan tersimpan di perangkat ini. Sinkron antar-HP butuh server (belum aktif).</div>`:`<div class='note'>Berlangganan dulu untuk mengundang anggota.</div>`}`}
function addMem(){const e=$('#me').value.trim();if(!e.includes('@'))return toast('Masukkan email yang valid');if(mem.length>=4)return toast('Maksimal 5 anggota (termasuk kamu)');if(mem.some(m=>m.email==e))return toast('Email sudah diundang');mem.push({email:e,role:$('#mr').value});LS.ft_mem=JSON.stringify(mem);render();toast('Undangan dikirim (simulasi) ✓')}
function delMem(i){mem.splice(i,1);LS.ft_mem=JSON.stringify(mem);render()}
let CH=[];
function obRoot(h){let d=$('#ob');if(!d){d=document.createElement('div');d.id='ob';d.className='ob';document.body.append(d)}d.innerHTML=`<div class='pg'>${h}</div>`}
function obClose(){const d=$('#ob');if(d)d.remove();LS.ft_seen=1}
function obAdd(){obClose();go('add')}
function obTry(i){obClose();go(CH[i][3])}
function obWelcome(){obRoot(`<img src='${LOGO}' style='width:210px;max-width:65%'><h2 style='font-size:24px'>Selamat datang di FreshTag!</h2><p style='color:var(--m)'>Catat bahan makananmu, tahu kapan kedaluwarsa, dan kurangi makanan terbuang. Mau panduan singkat 2 menit?</p><button class='b' style='width:100%;margin-bottom:8px;padding:13px' onclick='obList()'>🌱 Saya pengguna baru, tunjukkan caranya</button><button class='b s' style='width:100%' onclick='obClose()'>Sudah paham, lewati</button>`)}
function obList(){obRoot(`<h2>📖 Panduan pemula</h2><p class='note'>Pilih bab, atau mulai dari bab 1.</p>${CH.map((c,i)=>`<button class='ch' onclick='obStep(${i})'><span>${c[0]}</span><div><small style='color:var(--m)'>Bab ${i+1}</small><br><b>${c[1]}</b></div></button>`).join('')}<button class='b' style='width:100%;margin-top:6px' onclick='obStep(0)'>Mulai dari bab 1 ›</button><button class='b s' style='width:100%;margin-top:8px' onclick='obClose()'>Tutup panduan</button>`)}
function obStep(i){const c=CH[i],last=i==CH.length-1;obRoot(`<div class='pbar'><i style='width:${(i+1)/CH.length*100}%'></i></div><small style='color:var(--m)'>Bab ${i+1} dari ${CH.length}</small><div class='big'>${c[0]}</div><h2>${c[1]}</h2><ul>${c[4].map(s=>`<li>${s}</li>`).join('')}</ul><button class='b s' style='width:100%;margin:6px 0' onclick='obTry(${i})'>👉 ${c[2]} sekarang</button><div style='display:flex;gap:8px'><button class='b s' style='flex:1' onclick='${i?`obStep(${i-1})`:'obList()'}'>‹ Sebelumnya</button><button class='b' style='flex:1' onclick='${last?'obDone()':`obStep(${i+1})`}'>${last?'Selesai 🎉':'Berikutnya ›'}</button></div><button class='b s sm' style='margin-top:10px' onclick='obList()'>Daftar bab</button>`)}
function obDone(){obRoot(`<div class='big'>🎉</div><h2>Kamu siap!</h2><p style='color:var(--m)'>Mulai dengan menambah bahan pertamamu, atau lihat dulu dengan data contoh.</p><button class='b' style='width:100%;margin-bottom:8px' onclick='obAdd()'>➕ Tambah bahan pertama</button><button class='b s' style='width:100%' onclick='obClose();demo()'>Isi data contoh</button>`);for(let k=0;k<24;k++){const e=document.createElement('div');e.className='cf';e.textContent=['🥬','🍎','🥕','🍅','🍌','🎉'][k%6];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.5+'s';document.body.append(e);setTimeout(()=>e.remove(),5000)}}

'FreshTag membantu kamu mencatat bahan makanan dan kapan kedaluwarsanya.':'FreshTag helps you track your groceries and when they expire.','Beranda menampilkan total stok, yang segera habis (3 hari), dan yang sudah kedaluwarsa.':'Home shows your total stock, items expiring soon (3 days), and items already expired.','Bahan yang perlu perhatian muncul paling atas, jadi tidak ada yang terbuang diam-diam.':'Items that need attention appear at the top, so nothing gets wasted unnoticed.','Ketuk buah, sayur, atau lauk di daftar cepat. Tanggal kedaluwarsa terisi otomatis.':'Tap a fruit, vegetable, or side dish in the quick list. The expiry date fills in automatically.','Tidak ada di daftar? Isi form manual: nama, kategori, jumlah, tanggal beli.':'Not in the list? Use the manual form: name, category, quantity, purchase date.','Tanggal otomatis hanya perkiraan. Cek kondisi bahan aslinya ya.':'Automatic dates are only estimates. Please check the actual condition of the item.','Tekan Buka kamera, lalu izinkan akses kamera.':'Press Open camera, then allow camera access.','Arahkan ke barcode kemasan. Nama produk dicari otomatis.':'Point at the package barcode. The product name is looked up automatically.','Barcode tidak memuat tanggal kedaluwarsa, jadi tanggalnya perkiraan. Cocokkan dengan tanggal di kemasan.':'A barcode does not contain the expiry date, so the date is an estimate. Compare it with the date on the package.','Tanggal exp berwarna merah di bawah nama bahan. Tulisan perkiraan berarti belum kamu cek.':'The exp date is red under the item name. The word estimate means you have not checked it yet.','Tekan Ubah untuk mengganti nama, kategori, jumlah, tanggal beli, dan kedaluwarsa.':'Press Edit to change the name, category, quantity, purchase date, and expiry.','Setelah tanggal kamu ubah, tulisannya berganti jadi sesuai kemasan.':'Once you change the date, the label switches to matches package.','Tekan Habis kalau bahan sudah dipakai, atau Hapus kalau mau dibuang.':'Press U  return `<div class='grid'>${idx.map(btn).join('')}</div><div class='note'>${used?'Diurutkan dari yang paling sering dan baru kamu beli.':'Daftar akan menyesuaikan setelah kamu menambahkan beberapa bahan.'} Tanggal kedaluwarsa hanya <b>perkiraan</b>, bukan pasti. Cek kondisi dan kemasan.</div><button class='b s sm' style='margin-top:8px' onclick='toggleAll()'>${showAll?'Tampilkan lebih sedikit':'Lihat semua bahan'}</button>`}
function shopSetTitle(v){shopTitle=String(v).trim().slice(0,60);LS.ft_shtitle=shopTitle;render()}
function shopHtml(){return `<div class='card' id='shl'><h2>🛒 ${esc(shopTitle||L('Daftar belanja','Shopping list'))}</h2><input id='sti' type='text' value='${esc(shopTitle)}' placeholder='${L('Judul daftar belanja (opsional)','Shopping list title (optional)')}' onchange='shopSetTitle(this.value)' autocomplete='off' style='margin-bottom:8px'><div class='note' style='margin:0 0 8px'>${L('Barang yang kamu tandai habis masuk ke sini otomatis. Tulis jumlah di kotak sebelah nama.','Items you mark as used up land here automatically. Type the amount in the box next to the name.')}</div>${shopL.length?shopL.map(x=>`<div class='item'><label style='flex:1;display:flex;gap:8px;align-items:center;margin:0;font-size:14px;color:var(--ink);min-width:0'><input type='checkbox' style='width:auto' ${x.done?'checked':''} onchange='shopTick(${x.id},this.checked)'><span>${esc(x.name)}</span></label><input class='qs' type='text' autocomplete='off' value='${esc(x.qty)}' onchange='shopQty(${x.id},this.value)' aria-label='Qty'><button class='b d xs' onclick='shopDel(${x.id})'>✕</button></div>`).join(''):`<div class='empty'>${L('Daftar belanja kosong.','Your shopping list is empty.')}</div>`}<div class='bar' style='margin-top:10px'><input id='sa' placeholder='${L('Tambah barang…','Add an item…')}'><input id='sq' class='qs' type='text' autocomplete='off' placeholder='${L('Jumlah','Amount')}'><button class='b s' onclick='shopManual()'>+</button></div><div style='display:flex;gap:8px;flex-wrap:wrap'><button class='b' onclick='shopBuy()'>${L('Masukkan yang dibeli ke stok','Add bought items to stock')}</button><button class='b s' onclick='shopPng()'>⬇️ ${L('Unduh PNG','Download PNG')}</button></div></div>`}
function homeShop(){const n=shopL.length;return `<div class='card'><h2>🛒 ${esc(shopTitle||L('Daftar belanja','Shopping list'))}</h2>${n?`<div class='note' style='margin:0 0 8px'>${n} ${L('barang menunggu dibeli','items to buy')} · ${L('centang yang sudah dibeli','tick what you bought')}</div><div class='hsl'>${shopL.map(x=>`<label><input type='checkbox' ${x.done?'checked':''} onchange='shopTick(${x.id},this.checked)'><span class='nm'>${esc(x.name)}</span><small>${esc(x.qty)}</small></label>`).join('')}</div>`:`<div class='empty'>${L('Daftar belanja kosong.','Your shopping list is empty.')}</div>`}<div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:10px'><button class='b s sm' onclick="go('plan')">${L('Buka daftar belanja','Open shopping list')}</button>${n?`<button class='b sm' onclick='shopBuy()'>${L('Masukkan yang dibeli ke stok','Add bought items to stock')}</button>`:''}</div></div>`}
function urgTog(){urgOpen=!urgOpen;render()}
function remCard(){return `<div class='card'><h2>🔔 Pengingat</h2><button class='b' onclick='askNotif()'>Aktifkan notifikasi browser</button><div class='note'>Notifikasi muncul saat aplikasi terbuka. Untuk notifikasi saat tertutup perlu push server (lihat langkah berikutnya).</div></div>`}
function dash(){
 const ex=items.filter(i=>left(i)<0),so=items.filter(i=>left(i)>=0&&left(i)<=3);
 const urgent=[...ex,...so].sort((a,b)=>left(a)-left(b)),shown=urgOpen?urgent:urgent.slice(0,2);
 return `<div id='hi2' class='card dh'></div>${todayPlanCard()}<div class="stats"><div class="stat"><b>${items.length}</b><small>Total stok</small></div><div class="stat"><b style="color:var(--o)">${so.length}</b><small>Segera habis (≤3 hr)</small></div><div class="stat"><b style="color:var(--r)">${ex.length}</b><small>Kedaluwarsa</small></div></div>
 ${cookCard()}${homeShop()}<div class="card"><h2>⚠️ Perlu perhatian</h2>${urgent.length?shown.map(i=>row(i)).join(""):`<div class="empty">Semua aman 🎉</div>`}
 ${urgent.length>2?`<button class='b s sm' style='margin-top:8px' onclick='urgTog()'>${urgOpen?L('Lihat lebih sedikit','See less'):L('Lihat lebih','See more')+' ('+(urgent.length-2)+')'}</button>`:''}
 ${ex.length?`<button class="b d" style="margin-top:10px;display:block" onclick="clearExpired()">🗑️ Buang semua yang kedaluwarsa</button>`:""}</div>
 <div class="card"><h2>🌱 Dampak kamu</h2><div class='stats' style='margin:0'><div class='stat'><b style='color:var(--g)'>${stats.used}</b><small>Makanan terpakai</small></div><div class='stat'><b style='color:var(--r)'>${stats.waste+ex.length}</b><small>Terbuang</small></div><div class='stat'><b>${(()=>{const t=stats.used+stats.waste+ex.length;return t?Math.round(100*stats.used/t):0})()}%</b><small>Tingkat hemat</small></div></div><div class='note'>Contoh: 7 terpakai + 3 terbuang = hemat 70%. Makanan yang lewat kedaluwarsa otomatis masuk <b>Terbuang</b> dan menurunkan persentase hemat.</div></div>
 ${items.length?"":`<div class="card"><button class="b s" onclick="demo()">Isi data contoh</button></div>`}${aboutUs()}`}
function planPick(m){pickM=m;pickOpen={};pickMore={};modal(`<h2>${m}</h2><div class='note'>${L('Menu direkomendasikan dari Ide masak: semua bahannya ada di stok kamu. Ketuk tingkat kesulitan untuk melihat 3 rekomendasi utama.','Recommended from Cooking ideas: all ingredients are in your stock. Tap a difficulty level to see the top 3 picks.')}</div><div id='pk'>${pickHtml()}</div>`)}
function pickHtml(){const A=recFull();return [1,2,3].map(lv=>{const R=A.filter(r=>r.lv==lv),open=!!pickOpen[lv],more=!!pickMore[lv],show=open?R.slice(0,more?5:3):[];
 return `<div style='margin:8px 0'><button class='b s' style='width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px' onclick='pickTog(${lv})'><span><span class='badge ${LC[lv]}'>${LV[lv]}</span> <small>${R.length} ${L('resep siap dimasak','ready to cook')}</small></span><span>${open?'▲':'▼'}</span></button>${open?(R.length?show.map((r,i)=>`<div class='item'><div class='n'><b>${r.n}</b><small>${i<3?'⭐ ':''}${r.ing.join(', ')}</small></div><button class='b sm' onclick="planAdd(${r.idx},'${pickM}')">${L('Pilih','Choose')}</button></div>`).join('')+(R.length>3?`<button class='b s sm' style='margin-top:8px' onclick='pickMoreTog(${lv})'>${more?L('Lihat lebih sedikit','See less'):L('Lihat lebih','See more')}</button>`:''):`<div class='empty'>${L('Belum ada resep di tingkat ini yang semua bahannya ada di stok.','No recipe at this level has all its ingredients in stock yet.')}</div>`):''}</div>`}).join('')}
function pickTog(lv){pickOpen[lv]=!pickOpen[lv];pickMore[lv]=false;const e=$('#pk');if(e)e.innerHTML=pickHtml()}
function pickMoreTog(lv){pickMore[lv]=!pickMore[lv];const e=$('#pk');if(e)e.innerHTML=pickHtml()}
(function(){const st=document.createElement('style');st.textContent=`.qs{width:124px;flex:0 0 124px;min-width:0!important;text-align:center;padding:7px}.hsl{max-height:171px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:1px solid #e2eadf;border-radius:12px;background:#fff}.hsl label{display:flex;align-items:center;gap:10px;height:56px;box-sizing:border-box;padding:0 12px;margin:0;border-bottom:1px solid #eef3ec;color:var(--ink);font-size:15px}.hsl label:last-child{border-bottom:0}.hsl input{width:auto;flex:0 0 auto}.hsl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hsl small{flex:0 0 auto;color:var(--mut,#6b7a70);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}`;document.head.append(st)})();

render();pfBtn();pruneLog();checkNotif();if(lang=='en'){const b=$('#lb');if(b)b.textContent='🌐 ID'}hiBar();setInterval(hiBar,20000);if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});startFlow();setInterval(()=>{checkNotif();if(tab=="dash")render()},36e5);
</script>
